name: SeigoIME APK 자동 만들기

on:
  workflow_dispatch:
    inputs:
      run_install_test:
        description: "Android 14 에뮬레이터에 APK 설치 테스트"
        required: true
        type: boolean
        default: true
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"
      - "scripts/ci/**"

permissions:
  contents: read

concurrency:
  group: seigoime-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK 빌드와 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 1. 저장소 가져오기
        uses: actions/checkout@v4

      - name: 2. JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3. Gradle 8.1.1 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.1.1"

      - name: 4. Android SDK 34 확인
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | sed -n '1,120p'

      - name: 5. 프로젝트와 일본어 사전 검사
        shell: bash
        run: bash scripts/ci/verify_project.sh

      - name: 6. Debug APK 빌드
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            clean \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            --stacktrace

      - name: 7. Debug APK 정리와 내부 자산 검사
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          DEBUG_APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$DEBUG_APK"
          cp "$DEBUG_APK" artifacts/SeigoIME-v1.1-debug.apk
          unzip -l artifacts/SeigoIME-v1.1-debug.apk | grep -q 'assets/kanji_data.csv'
          echo "일본어 사전이 APK 안에 포함되어 있습니다."
          sha256sum artifacts/SeigoIME-v1.1-debug.apk | tee artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: 8. Release 서명정보 준비
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEIGO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SEIGO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEIGO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SEIGO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-release-key.jks
            {
              echo "storeFile=my-release-key.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release APK 서명정보가 준비되었습니다."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release Secrets가 없어 설치 가능한 Debug APK만 생성합니다."
          fi

      - name: 9. 서명된 Release APK 빌드
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease --stacktrace
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$RELEASE_APK"
          cp "$RELEASE_APK" artifacts/SeigoIME-v1.1-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            artifacts/SeigoIME-v1.1-release.apk
          sha256sum artifacts/SeigoIME-v1.1-release.apk >> artifacts/SHA256SUMS.txt

      - name: 10. APK 다운로드 파일로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: SeigoIME-APK-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: 11. 검사 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SeigoIME-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  emulator_install_test:
    name: Android 14 실제 설치 확인
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.run_install_test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 1. 저장소 가져오기
        uses: actions/checkout@v4

      - name: 2. 생성된 APK 받기
        uses: actions/download-artifact@v4
        with:
          pattern: SeigoIME-APK-*
          path: artifacts
          merge-multiple: true

      - name: 3. KVM 가속 허용
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 4. Android 14 에뮬레이터 설치 테스트
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ci/emulator_install_test.sh

      - name: 5. 설치 테스트 결과 받기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SeigoIME-emulator-test-${{ github.run_number }}
          path: emulator-results/
          if-no-files-found: warn
          retention-days: 14
